<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>by Maya — The story of a piece</title>
<meta name="description" content="Every painting carries a story. Scroll through the making of Maya's hand-painted originals — up close, where the craft lives.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23F8F5EE'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%235A7A57' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ivory:#F8F5EE; --sage:#8BA888; --sage-dark:#5A7A57;
  --ink:#1C1A16; --gold:#C4973A; --muted:rgba(28,26,22,0.58);
}
html{scroll-behavior:smooth;}
body{font-family:'Jost',sans-serif;font-weight:300;color:var(--ink);background:var(--ivory);line-height:1.7;}

/* top chip */
#back-link{
  position:fixed;top:1rem;left:1rem;z-index:50;
  display:inline-flex;align-items:center;gap:.5rem;
  padding:.6rem 1.1rem;background:rgba(248,245,238,0.92);color:var(--ink);text-decoration:none;
  border:1px solid rgba(90,122,87,0.3);border-radius:999px;
  font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;transition:background .2s;
}
#back-link:hover{background:#fff;}

/* ── opening: the detail, larger than life ── */
.open{
  min-height:100vh;position:relative;
  background-size:cover;background-position:center;
  display:flex;align-items:flex-end;
}
.open::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(28,26,22,0.72));}
.open-text{position:relative;z-index:2;padding:4rem 5vw 5rem;color:#fff;max-width:640px;}
.open-text .eyebrow{font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:rgba(248,245,238,0.75);margin-bottom:1rem;}
.open-text h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(2.4rem,6vw,4rem);line-height:1.1;margin-bottom:.8rem;}
.open-text h1 em{font-style:italic;color:#D9C08A;}
.open-text .sub{font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(248,245,238,0.65);}
.scroll-cue{
  position:absolute;bottom:1.6rem;left:50%;transform:translateX(-50%);z-index:2;
  color:rgba(248,245,238,0.7);font-size:.62rem;letter-spacing:.26em;text-transform:uppercase;
  animation:cueFloat 2.4s ease-in-out infinite;
}
@keyframes cueFloat{0%,100%{transform:translate(-50%,0);}50%{transform:translate(-50%,7px);}}

/* ── the piece in full ── */
.piece{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:6rem 1.5rem;gap:1.6rem;text-align:center;
}
.piece img{max-height:72vh;max-width:min(92vw,720px);box-shadow:0 24px 70px rgba(28,26,22,0.28);}
.piece .caption{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.2rem;}
.piece .dims{font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);}

/* ── the film ── */
.film{
  background:rgba(28,26,22,0.95);color:#fff;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:5rem 1.5rem;gap:1.8rem;text-align:center;
}
.film .label{font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:rgba(139,168,136,0.9);}
.film h2{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(1.8rem,4vw,2.6rem);}
.film h2 em{font-style:italic;color:var(--gold);}
.film-card{position:relative;aspect-ratio:320/568;height:min(64vh,560px);cursor:pointer;box-shadow:0 18px 50px rgba(0,0,0,0.5);background:#000;}
.film-card video{width:100%;height:100%;object-fit:cover;display:block;}
.film-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(28,26,22,0.25);transition:opacity .3s;pointer-events:none;}
.film-play::before{content:'';width:64px;height:64px;border:2px solid rgba(248,245,238,0.95);border-radius:50%;position:absolute;}
.film-play::after{content:'';border-style:solid;border-width:11px 0 11px 18px;border-color:transparent transparent transparent rgba(248,245,238,0.95);margin-left:5px;}
.film-card.playing .film-play{opacity:0;}
.film .hint{font-size:.64rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(248,245,238,0.45);}

/* ── the story ── */
.story{
  min-height:88vh;display:flex;align-items:center;justify-content:center;
  padding:6rem 1.5rem;
}
.story-inner{max-width:560px;}
.story .label{font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--sage-dark);margin-bottom:1.6rem;}
.story p{
  font-family:'Cormorant Garamond',serif;font-size:clamp(1.25rem,2.6vw,1.55rem);
  font-weight:300;line-height:1.75;margin-bottom:1.4rem;
}
.story p strong{font-weight:500;}
.sample-note{
  margin-top:2rem;font-family:'Jost',sans-serif;font-size:.68rem;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(28,26,22,0.35);
}

/* ── close ── */
.close-section{
  background:rgba(232,239,226,0.7);
  padding:6rem 1.5rem;text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:1.4rem;
}
.close-section h2{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(1.8rem,4vw,2.5rem);}
.close-section h2 em{font-style:italic;color:var(--sage-dark);}
.btn-primary{display:inline-block;padding:.95rem 2.4rem;background:var(--sage-dark);color:#fff;text-decoration:none;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;transition:background .25s;border-radius:1px;}
.btn-primary:hover{background:var(--ink);}
.next-link{
  display:inline-flex;align-items:center;gap:.5rem;margin-top:.6rem;
  color:var(--sage-dark);text-decoration:none;
  font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.15rem;
  border-bottom:1px solid rgba(90,122,87,0.35);padding-bottom:2px;transition:border-color .2s;
}
.next-link:hover{border-color:var(--sage-dark);}
</style>
</head>
<body>

<a id="back-link" href="index.html#gallery">← by Maya</a>

<section class="open" id="s-open">
  <div class="open-text">
    <p class="eyebrow">The story of a piece</p>
    <h1 id="open-title"></h1>
    <p class="sub" id="open-sub"></p>
  </div>
  <div class="scroll-cue">Scroll</div>
</section>

<section class="piece">
  <img id="piece-img" src="" alt="">
  <p class="caption" id="piece-caption"></p>
  <p class="dims" id="piece-dims"></p>
</section>

<section class="film" id="s-film" hidden>
  <p class="label">On film</p>
  <h2>Watch it <em>come to life</em></h2>
  <div class="film-card" id="film-card" tabindex="0" role="button" aria-label="Play the painting film">
    <video id="film-video" src="" poster="" preload="none" playsinline></video>
    <div class="film-play" aria-hidden="true"></div>
  </div>
  <p class="hint">Tap to play · sound on for the studio experience</p>
</section>

<section class="story">
  <div class="story-inner">
    <p class="label">Behind the painting</p>
    <div id="story-text"></div>
    <p class="sample-note" id="sample-note" hidden>Sample story for preview — Maya will tell the real one</p>
  </div>
</section>

<section class="close-section">
  <h2>Every commission carries <em>a story like this</em></h2>
  <a class="btn-primary" href="index.html#order">Start your own</a>
  <a class="next-link" id="next-link" href=""></a>
</section>

<script>
/* Story registry. `sample:true` stories are invented placeholders for
   testing the format — swap in Maya's real accounts before promoting this
   page beyond preview. */
const STORIES = {
  bouquet: {
    title: 'The bouquet that <em>refused to wilt</em>',
    sub: 'Summer bouquet · Watercolour · A5',
    open: 'stories/bouquet_open.jpg',
    img: 'bouquet_corrected.jpg',
    caption: 'Summer bouquet — watercolour on paper',
    dims: '14.8 × 21 cm · A5 · Sold',
    sample: true,
    story: [
      'The morning after her sister’s wedding, Hanna gathered the bouquet from the head table — delphinium, roses, a single stubborn daisy — and realised it had three days to live.',
      'She sent one photo, taken on the kitchen counter in morning light. <strong>“Can you keep it?”</strong>',
      'Two weeks later the flowers were gone, and also not: every stem in its place, the blue a little deeper than life, the way memory always paints it.'
    ],
    next: 'scroll'
  },
  scroll: {
    title: 'A painting that is <em>its own frame</em>',
    sub: 'Japanese hanging scroll · Kakejiku · 30 × 80 cm',
    open: 'scroll_detail_bird.jpg',
    img: 'scroll_full.png',
    caption: 'Hand-painted kakejiku — bird among flowering branches',
    dims: '30 × 80 cm · silk brocade mounting · Sold',
    sample: true,
    story: [
      'Some pieces want no glass and no frame. The kakejiku is painted on paper, mounted on silk brocade, weighted with a wooden roller — the way scrolls have hung for centuries.',
      'This one was a farewell gift for a colleague returning to Osaka after eleven years in Stockholm: a Nordic bird, painted in an old Japanese form. <strong>Two homes, one wall.</strong>',
      'It ships rolled and tied, and opens like a letter.'
    ],
    next: 'chico'
  },
  chico: {
    title: 'Chico, who <em>never sits still</em>',
    sub: 'Dog portrait · Watercolour · Commission',
    open: 'stories/chico_open.jpg',
    img: 'stories/chico_open.jpg',
    caption: 'Chico — watercolour portrait in progress',
    dims: 'Watercolour · private commission',
    film: { src: 'videos/process_chico.mp4', poster: 'videos/poster_chico.jpg' },
    sample: true,
    story: [
      'Chico is a samoyed with one working setting: motion. In four years his family had a thousand photos of him and not one where he wasn’t mid-leap.',
      'A painting can do what a camera couldn’t — hold him still for a moment without asking him to be. Fur in forty shades of white, painted stroke by patient stroke.',
      '<strong>The whole hour of his becoming is in the film above.</strong>'
    ],
    next: 'bouquet'
  }
};

function load(key) {
  if (!STORIES[key]) key = 'bouquet';
  const s = STORIES[key];
  document.getElementById('s-open').style.backgroundImage = `url('${s.open}')`;
  document.getElementById('open-title').innerHTML = s.title;
  document.getElementById('open-sub').textContent = s.sub;
  const pieceImg = document.getElementById('piece-img');
  pieceImg.src = s.img; pieceImg.alt = s.caption;
  document.getElementById('piece-caption').textContent = s.caption;
  document.getElementById('piece-dims').textContent = s.dims;
  document.getElementById('story-text').innerHTML = s.story.map(p => `<p>${p}</p>`).join('');
  document.getElementById('sample-note').hidden = !s.sample;

  const filmSec = document.getElementById('s-film');
  const video = document.getElementById('film-video');
  const card = document.getElementById('film-card');
  video.pause(); card.classList.remove('playing');
  if (s.film) {
    filmSec.hidden = false;
    video.src = s.film.src; video.poster = s.film.poster;
  } else {
    filmSec.hidden = true; video.removeAttribute('src');
  }

  const nxt = STORIES[s.next];
  const nextLink = document.getElementById('next-link');
  nextLink.href = '#' + s.next;
  nextLink.innerHTML = 'Next story: ' + nxt.title.replace(/<[^>]+>/g, '') + ' →';

  history.replaceState(null, '', '#' + key);
  scrollTo({ top: 0, behavior: 'instant' });
}

/* film card toggle */
(function() {
  const card = document.getElementById('film-card');
  const v = document.getElementById('film-video');
  const toggle = () => {
    if (!v.src) return;
    if (v.paused) { v.muted = false; v.play(); card.classList.add('playing'); }
    else { v.pause(); card.classList.remove('playing'); }
  };
  card.addEventListener('click', toggle);
  card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
  v.addEventListener('ended', () => { card.classList.remove('playing'); v.currentTime = 0; });
})();

addEventListener('hashchange', () => load(location.hash.replace('#', '')));
load(location.hash.replace('#', '') || 'bouquet');
</script>
</body>
</html>
