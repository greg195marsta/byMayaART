<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>by Maya — See the art in a room</title>
<meta name="description" content="Hang Maya's hand-painted originals in beautiful real rooms — every piece shown at its true real-world size.">
<meta name="robots" content="noindex">
<!-- Room photographs via Unsplash (unsplash.com/license — free for commercial
     use, no attribution required). Photo IDs: qY3pLOIpt4w (bright),
     xdSqdwnQP-I (reading), iL9Ucm18HCE (evening). -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23F8F5EE'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%235A7A57' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#1C1A16;font-family:'Jost',sans-serif;overflow:hidden;}

#stage{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  padding:4.2rem 0 7.2rem;
}
/* The room container keeps the photo's exact aspect ratio; the painting is
   positioned in % of this box, so it stays glued to the wall at any size. */
#room-box{
  position:relative;height:100%;max-width:96vw;
  box-shadow:0 30px 80px rgba(0,0,0,0.55);
  transition:opacity .45s ease;
}
#room-box.fading{opacity:0;}
#room-img{width:100%;height:100%;display:block;object-fit:contain;}
#art-wrap{
  position:absolute;transform:translate(-50%,-50%);
  transition:left .5s ease,top .5s ease,width .5s ease,height .5s ease;
}
#art-wrap img{
  width:100%;height:100%;display:block;object-fit:contain;
  filter:drop-shadow(0 10px 16px rgba(28,26,22,0.38));
}
/* CSS frame for pieces photographed without one (plain white background) */
#art-wrap.framed{
  background:#FDFBF6;
  border:3px solid #33302A;
  padding:4.5%;
  box-shadow:0 12px 22px rgba(28,26,22,0.42);
}
#art-wrap.framed img{filter:none;}
/* gentle ambient tint so the artwork sits in the room's light — display
   simulation only, the artwork files themselves are never altered */
.tint-warm #art-wrap img{filter:sepia(0.12) brightness(0.96) drop-shadow(0 10px 16px rgba(28,26,22,0.45));}
.tint-warm #art-wrap.framed img{filter:sepia(0.12) brightness(0.96);}

/* HUD */
.hud{position:fixed;z-index:10;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;}
#back-link{
  top:1rem;left:1rem;display:inline-flex;align-items:center;gap:.5rem;
  padding:.6rem 1.1rem;background:rgba(248,245,238,0.92);color:#1C1A16;text-decoration:none;
  border-radius:999px;transition:background .2s;
}
#back-link:hover{background:#fff;}
#room-switch{
  top:1rem;left:50%;transform:translateX(-50%);
  display:flex;gap:.35rem;background:rgba(248,245,238,0.92);
  padding:.3rem;border-radius:999px;
}
#room-switch button{
  border:none;background:none;padding:.45rem 1rem;border-radius:999px;cursor:pointer;
  font-family:'Jost',sans-serif;font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;
  color:rgba(28,26,22,0.55);transition:background .2s,color .2s;white-space:nowrap;
}
#room-switch button.active{background:#5A7A57;color:#fff;}

/* painting picker */
#picker{
  position:fixed;bottom:0;left:0;right:0;z-index:10;
  display:flex;align-items:center;justify-content:center;gap:.7rem;
  padding:.9rem 1rem calc(.9rem + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,rgba(28,26,22,0.85) 40%);
}
.thumb{
  height:62px;min-width:44px;padding:4px;background:rgba(248,245,238,0.14);
  border:1px solid rgba(248,245,238,0.25);border-radius:2px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s,border-color .2s,transform .2s;
}
.thumb img{max-height:100%;max-width:60px;display:block;}
.thumb:hover{transform:translateY(-3px);background:rgba(248,245,238,0.25);}
.thumb.active{border-color:#C4973A;background:rgba(248,245,238,0.28);}
.thumb.hidden{display:none;}

#art-card{
  position:fixed;bottom:6.4rem;left:50%;transform:translateX(-50%);z-index:9;
  text-align:center;pointer-events:none;
  color:rgba(248,245,238,0.94);
  text-shadow:0 2px 10px rgba(0,0,0,0.5);
}
#art-card .t{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.15rem;letter-spacing:.02em;text-transform:none;}
#art-card .d{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:rgba(248,245,238,0.6);margin-top:.2rem;}

#scale-note{
  bottom:1rem;right:1rem;color:rgba(248,245,238,0.45);
  background:rgba(28,26,22,0.5);padding:.4rem .9rem;border-radius:999px;
}
@media (max-width:640px){
  #scale-note{display:none;}
  #room-switch{font-size:.6rem;}
  #stage{padding:3.6rem 0 6.6rem;}
}
</style>
</head>
<body>

<div id="stage">
  <div id="room-box">
    <img id="room-img" src="" alt="Interior room photograph">
    <div id="art-wrap"><img id="art-img" src="" alt=""></div>
  </div>
</div>

<a id="back-link" class="hud" href="index.html">← by Maya</a>
<div id="room-switch" class="hud">
  <button data-room="bright">Bright room</button>
  <button data-room="reading">Reading corner</button>
  <button data-room="evening">Evening nook</button>
</div>
<div id="art-card"><div class="t"></div><div class="d"></div></div>
<div id="picker"></div>
<div id="scale-note" class="hud">Shown at true size for this room</div>

<script>
/* Every painting's real-world size in cm — the same truth-in-scale rule as
   the main page. The room anchor + pxPerCm place it on the photographed wall
   at honest scale relative to the furniture. */
const WORKS = {
  bouquet:    { src:'bouquet_corrected.jpg',         w:14.8, h:21,   title:'Summer bouquet',    detail:'Watercolour · A5' },
  lovebirds:  { src:'lovebirds_corrected.png',       w:14.8, h:21,   title:'Lovebirds',         detail:'Watercolour · A5' },
  penguin:    { src:'improvedpenguin.png',           w:14.8, h:21,   title:'Penguin portrait',  detail:'Watercolour · A5' },
  sunflowers: { src:'improvedwatercolorflowers.png', w:21,   h:29.7, title:'Sunflowers',        detail:'Acrylic · A4' },
  audrey:     { src:'audrey_scarf.png',              w:29.7, h:42,   title:"Audrey's scarf",    detail:'Pencil · A3', cssFrame:true },
  scroll:     { src:'scroll_full.png',               w:30,   h:80,   title:'Hanging scroll',    detail:'Kakejiku · 30×80 cm' }
};

/* Room definitions. anchor = where art centres on the wall (fraction of the
   photo). pxPerCm calibrated against the furniture in each photo.
   top/bottom limits keep tall pieces off sofas, plants and lamps. */
const ROOMS = {
  bright: {
    img:'rooms/room-bright.jpg', w:1600, h:2400,
    name:'Bright room',
    anchor:{ cx:0.50, cy:0.325 }, pxPerCm:10,
    topLimit:0.045, bottomLimit:0.465,
    works:['bouquet','lovebirds','penguin','sunflowers','audrey','scroll'],
    tint:false
  },
  reading: {
    img:'rooms/room-reading.jpg', w:1600, h:2844,
    name:'Reading corner',
    anchor:{ cx:0.245, cy:0.285 }, pxPerCm:10,
    topLimit:0.045, bottomLimit:0.325,
    works:['bouquet','lovebirds','penguin','sunflowers','audrey'],
    tint:false
  },
  evening: {
    img:'rooms/room-evening.jpg', w:1600, h:2400,
    name:'Evening nook',
    anchor:{ cx:0.595, cy:0.215 }, pxPerCm:9,
    topLimit:0.03, bottomLimit:0.285,
    works:['bouquet','lovebirds','penguin','sunflowers'],
    tint:true
  }
};

const roomBox = document.getElementById('room-box');
const roomImg = document.getElementById('room-img');
const artWrap = document.getElementById('art-wrap');
const artImg = document.getElementById('art-img');
const picker = document.getElementById('picker');
const cardT = document.querySelector('#art-card .t');
const cardD = document.querySelector('#art-card .d');

let currentRoom = 'bright', currentWork = 'sunflowers';

/* build picker thumbs once */
for (const key in WORKS) {
  const b = document.createElement('div');
  b.className = 'thumb'; b.dataset.work = key;
  b.setAttribute('role', 'button');
  b.setAttribute('aria-label', 'Hang ' + WORKS[key].title + ' in the room');
  b.innerHTML = `<img src="${WORKS[key].src}" alt="${WORKS[key].title}">`;
  b.addEventListener('click', () => { currentWork = key; render(); });
  picker.appendChild(b);
}

function render() {
  const room = ROOMS[currentRoom];
  /* if the current work isn't offered in this room, fall back */
  if (!room.works.includes(currentWork)) currentWork = room.works[room.works.length - 1];
  const work = WORKS[currentWork];

  roomImg.src = room.img;
  roomBox.style.aspectRatio = room.w + ' / ' + room.h;
  document.body.classList.toggle('tint-warm', !!room.tint);

  /* true-scale placement */
  const wPx = work.w * room.pxPerCm, hPx = work.h * room.pxPerCm;
  /* CSS frame adds visual size; treat padding+border as part of hung object */
  const frameFactor = work.cssFrame ? 1.12 : 1;
  const wFrac = (wPx * frameFactor) / room.w;
  const hFrac = (hPx * frameFactor) / room.h;
  let cy = room.anchor.cy;
  if (cy + hFrac/2 > room.bottomLimit) cy = room.bottomLimit - hFrac/2;
  if (cy - hFrac/2 < room.topLimit)    cy = room.topLimit + hFrac/2;

  artWrap.classList.toggle('framed', !!work.cssFrame);
  artWrap.style.left = (room.anchor.cx * 100) + '%';
  artWrap.style.top = (cy * 100) + '%';
  artWrap.style.width = (wFrac * 100) + '%';
  artWrap.style.height = (hFrac * 100) + '%';
  artImg.src = work.src;
  artImg.alt = work.title + ' — shown at true size in this room';

  cardT.textContent = work.title;
  cardD.textContent = work.detail + ' · true size';

  document.querySelectorAll('.thumb').forEach(t => {
    t.classList.toggle('active', t.dataset.work === currentWork);
    t.classList.toggle('hidden', !room.works.includes(t.dataset.work));
  });
  document.querySelectorAll('#room-switch button').forEach(b =>
    b.classList.toggle('active', b.dataset.room === currentRoom));
  history.replaceState(null, '', '#' + currentRoom + '-' + currentWork);
}

function switchRoom(name) {
  if (!ROOMS[name] || name === currentRoom) return;
  roomBox.classList.add('fading');
  setTimeout(() => {
    currentRoom = name;
    render();
    roomImg.onload = () => roomBox.classList.remove('fading');
    /* safety: never stay faded if the image was cached and onload raced */
    setTimeout(() => roomBox.classList.remove('fading'), 600);
  }, 300);
}

document.querySelectorAll('#room-switch button').forEach(b =>
  b.addEventListener('click', () => switchRoom(b.dataset.room)));

/* deep link: #evening-bouquet */
const hash = location.hash.replace('#', '');
if (hash) {
  const [r, w] = hash.split('-');
  if (ROOMS[r]) currentRoom = r;
  if (WORKS[w]) currentWork = w;
}
render();

/* preload the other rooms after first paint */
addEventListener('load', () => {
  for (const k in ROOMS) { if (k !== currentRoom) (new Image()).src = ROOMS[k].img; }
});
</script>
</body>
</html>
